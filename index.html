<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业消消乐</title>
<style>
/* SECTION: reset-base */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: #fff;
  overflow: hidden;
  user-select: none;
}

/* SECTION: layout */
.app { display: flex; height: 100vh; width: 100vw; }

/* LEFT PANEL */
.left-panel {
  width: 320px;
  min-width: 280px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  padding: 24px 20px;
  gap: 20px;
  z-index: 10;
}

/* RIGHT PANEL */
.right-panel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  position: relative;
  overflow: hidden;
}

/* SECTION: title */
.app-title {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
}

/* SECTION: timer */
.timer-section {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
}
.timer-display {
  font-size: 52px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
  color: #4ecca3;
  transition: color 0.3s;
  line-height: 1.1;
}
.timer-display.warning { color: #f7971e; }
.timer-display.danger { color: #e74c3c; animation: pulse 0.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.timer-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.timer-input {
  width: 60px;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 14px;
  text-align: center;
  outline: none;
}
.timer-input:focus { border-color: #4ecca3; }
.timer-label { font-size: 13px; color: rgba(255,255,255,0.6); }

.btn {
  padding: 8px 18px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  outline: none;
}
.btn:active { transform: scale(0.95); }
.btn-start {
  background: linear-gradient(135deg, #4ecca3, #36b88a);
  color: #fff;
}
.btn-start:hover { box-shadow: 0 4px 15px rgba(78,204,163,0.4); }
.btn-start.running {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
}
.btn-start.running:hover { box-shadow: 0 4px 15px rgba(231,76,60,0.4); }
.btn-reset {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.15);
}
.btn-reset:hover { background: rgba(255,255,255,0.15); }

/* SECTION: completed list */
.completed-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.section-title {
  font-size: 15px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
}
.count-badge {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 20px;
}
.completed-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 4px;
}
.completed-list::-webkit-scrollbar { width: 4px; }
.completed-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

.completed-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(78,204,163,0.12);
  border-radius: 10px;
  border: 1px solid rgba(78,204,163,0.2);
  animation: slideInLeft 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}
.completed-item:hover { background: rgba(78,204,163,0.2); }
.completed-item .check { color: #4ecca3; font-size: 16px; flex-shrink: 0; }
.completed-item .name { flex: 1; }
.completed-item .time { font-size: 11px; color: rgba(255,255,255,0.4); }

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-30px) scale(0.8); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

/* SECTION: student bubbles */
.bubbles-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  gap: 0;
}
.student-bubble {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 -3px 6px rgba(0,0,0,0.15);
  animation: bubbleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  margin: 5px;
}
.student-bubble::after {
  content: '';
  position: absolute;
  top: 10px;
  left: 16px;
  width: 18px;
  height: 8px;
  background: rgba(255,255,255,0.35);
  border-radius: 50%;
  transform: rotate(-20deg);
}
.student-bubble:hover {
  transform: scale(1.15);
  box-shadow: 0 6px 25px rgba(0,0,0,0.3), inset 0 -3px 6px rgba(0,0,0,0.15);
  z-index: 5;
}
.student-bubble:active { transform: scale(0.9); }

.student-bubble.eliminating {
  animation: eliminate 0.6s cubic-bezier(0.55, 0, 0.1, 1) forwards;
  pointer-events: none;
}
@keyframes eliminate {
  0% { transform: scale(1); opacity: 1; }
  30% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}

@keyframes bubbleIn {
  from { opacity: 0; transform: scale(0) rotate(180deg); }
  to { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* SECTION: progress bar */
.progress-section {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px 16px;
}
.progress-bar-bg {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ecca3, #36b88a);
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  width: 0%;
}
.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}

/* SECTION: floating particles */
.particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  animation: particleFly 1s ease-out forwards;
  z-index: 100;
}
@keyframes particleFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

/* SECTION: celebration */
.celebration {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  pointer-events: none;
  animation: fadeIn 0.5s ease;
}
.celebration-text {
  font-size: 48px;
  font-weight: 800;
  background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 1.5s linear infinite, bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  text-shadow: none;
}
@keyframes shimmer { to { background-position: 200% center; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bounceIn {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

/* SECTION: empty state */
.empty-state {
  text-align: center;
  padding: 30px 10px;
  color: rgba(255,255,255,0.35);
  font-size: 13px;
  line-height: 1.8;
}
.empty-state .icon { font-size: 36px; margin-bottom: 8px; }

/* SECTION: responsive */
@media (max-width: 768px) {
  .app { flex-direction: column; }
  .left-panel {
    width: 100%;
    min-width: unset;
    height: auto;
    max-height: 40vh;
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 16px;
  }
  .right-panel { min-height: 60vh; }
  .student-bubble { width: 60px; height: 60px; font-size: 12px; margin: 4px; }
  .timer-display { font-size: 38px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="app-title">🎯 作业消消乐</div>

    <!-- Timer -->
    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">10:00</div>
      <div class="timer-controls">
        <input type="number" class="timer-input" id="timerMinutes" value="10" min="1" max="99" title="分钟">
        <span class="timer-label">分钟</span>
        <button class="btn btn-start" id="btnStart" onclick="toggleTimer()">开始</button>
        <button class="btn btn-reset" onclick="resetTimer()">重置</button>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-text">
        <span>完成进度</span>
        <span id="progressLabel">0 / 0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Completed List -->
    <div class="completed-section">
      <div class="section-header">
        <span class="section-title">✅ 已完成</span>
        <span class="count-badge" id="completedCount">0</span>
      </div>
      <div class="completed-list" id="completedList">
        <div class="empty-state" id="emptyState">
          <div class="icon">📋</div>
          点击右侧同学的名字<br>标记为已完成
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="bubbles-container" id="bubblesContainer"></div>
  </div>
</div>

<script>
/* ============================================================
   DATA & STATE
   ============================================================ */
const DEFAULT_STUDENTS = [
  '王子涵','李欣怡','张浩然','刘诗琪','陈宇航',
  '杨雨桐','赵子轩','黄思涵','周俊杰','吴佳琪',
  '徐明轩','孙雅婷','马晨曦','朱文博','胡雨欣',
  '郭子墨','林若曦','何俊豪','罗诗语','高天翔',
  '郑梦琪','梁志远','宋雨萱','谢子豪','韩思源',
  '唐嘉怡','冯浩然','董子琪','曹晨曦','邓文博',
  '彭雨桐','曾子轩','萧雅婷','田明轩','潘若曦',
  '蒋俊豪','蔡诗涵','余天翔','杜梦瑶','叶子墨',
  '程雨欣','苏子涵','魏嘉怡','吕志远','丁雨萱'
];

const BUBBLE_COLORS = [
  'linear-gradient(135deg, #667eea, #764ba2)',
  'linear-gradient(135deg, #f093fb, #f5576c)',
  'linear-gradient(135deg, #4facfe, #00f2fe)',
  'linear-gradient(135deg, #43e97b, #38f9d7)',
  'linear-gradient(135deg, #fa709a, #fee140)',
  'linear-gradient(135deg, #a18cd1, #fbc2eb)',
  'linear-gradient(135deg, #fccb90, #d57eeb)',
  'linear-gradient(135deg, #e0c3fc, #8ec5fc)',
  'linear-gradient(135deg, #f5576c, #ff6b6b)',
  'linear-gradient(135deg, #667eea, #4facfe)',
];

let students = [...DEFAULT_STUDENTS];
let completed = [];
let timerInterval = null;
let timerSeconds = 600;
let timerRunning = false;

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  renderBubbles();
  renderCompleted();
  updateTimerDisplay();
  updateProgress();
}

/* ============================================================
   BUBBLES
   ============================================================ */
function renderBubbles() {
  const container = document.getElementById('bubblesContainer');
  container.innerHTML = '';
  const remaining = students.filter(s => !completed.includes(s));
  remaining.forEach((name, i) => {
    const bubble = document.createElement('div');
    bubble.className = 'student-bubble';
    bubble.textContent = name;
    bubble.style.background = BUBBLE_COLORS[i % BUBBLE_COLORS.length];
    bubble.style.animationDelay = (i * 0.03) + 's';
    bubble.addEventListener('click', (e) => eliminateStudent(name, e));
    container.appendChild(bubble);
  });
}

function eliminateStudent(name, event) {
  if (completed.includes(name)) return;
  const bubble = event.currentTarget;

  // Particles
  spawnParticles(event.clientX, event.clientY, bubble.style.background);

  // Animate bubble out
  bubble.classList.add('eliminating');
  bubble.addEventListener('animationend', () => {
    completed.push(name);
    renderBubbles();
    renderCompleted();
    updateProgress();
    saveState();

    // Check all done
    if (completed.length === students.length) {
      showCelebration();
    }
  }, { once: true });
}

/* ============================================================
   COMPLETED LIST
   ============================================================ */
function renderCompleted() {
  const list = document.getElementById('completedList');
  const empty = document.getElementById('emptyState');
  document.getElementById('completedCount').textContent = completed.length;

  if (completed.length === 0) {
    list.innerHTML = '';
    list.appendChild(createEmptyState());
    return;
  }

  list.innerHTML = '';
  // Show newest first
  [...completed].reverse().forEach(name => {
    const item = document.createElement('div');
    item.className = 'completed-item';
    item.innerHTML = `<span class="check">✓</span><span class="name">${esc(name)}</span>`;
    item.title = '点击撤销';
    item.addEventListener('click', () => undoStudent(name));
    list.appendChild(item);
  });
}

function undoStudent(name) {
  completed = completed.filter(n => n !== name);
  renderBubbles();
  renderCompleted();
  updateProgress();
  saveState();
}

function createEmptyState() {
  const div = document.createElement('div');
  div.className = 'empty-state';
  div.innerHTML = '<div class="icon">📋</div>点击右侧同学的名字<br>标记为已完成';
  return div;
}

/* ============================================================
   PROGRESS
   ============================================================ */
function updateProgress() {
  const total = students.length;
  const done = completed.length;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total}`;
}

/* ============================================================
   TIMER
   ============================================================ */
function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (timerSeconds <= 0) {
    timerSeconds = parseInt(document.getElementById('timerMinutes').value) * 60 || 600;
  }
  timerRunning = true;
  const btn = document.getElementById('btnStart');
  btn.textContent = '暂停';
  btn.classList.add('running');
  document.getElementById('timerMinutes').disabled = true;

  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      pauseTimer();
      timerSeconds = 0;
      updateTimerDisplay();
      showTimeUp();
    }
  }, 1000);
}

function pauseTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  const btn = document.getElementById('btnStart');
  btn.textContent = '继续';
  btn.classList.remove('running');
}

function resetTimer() {
  pauseTimer();
  const mins = parseInt(document.getElementById('timerMinutes').value) || 10;
  timerSeconds = mins * 60;
  updateTimerDisplay();
  document.getElementById('btnStart').textContent = '开始';
  document.getElementById('timerMinutes').disabled = false;
}

function updateTimerDisplay() {
  const display = document.getElementById('timerDisplay');
  const mins = Math.floor(timerSeconds / 60);
  const secs = timerSeconds % 60;
  display.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

  display.classList.remove('warning', 'danger');
  if (timerSeconds <= 30 && timerSeconds > 0) display.classList.add('danger');
  else if (timerSeconds <= 120 && timerSeconds > 0) display.classList.add('warning');
}

// Update minutes input
document.getElementById('timerMinutes').addEventListener('change', function() {
  if (!timerRunning) {
    timerSeconds = (parseInt(this.value) || 10) * 60;
    updateTimerDisplay();
  }
});

/* ============================================================
   PARTICLES
   ============================================================ */
function spawnParticles(x, y, gradient) {
  const colors = ['#ffd200','#4ecca3','#f5576c','#4facfe','#fa709a','#a18cd1'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random() * 8;
    const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
    const dist = 40 + Math.random() * 60;
    p.style.cssText = `
      left: ${x - size/2}px; top: ${y - size/2}px;
      width: ${size}px; height: ${size}px;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      --tx: ${Math.cos(angle)*dist}px;
      --ty: ${Math.sin(angle)*dist}px;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

/* ============================================================
   CELEBRATION
   ============================================================ */
function showCelebration() {
  const el = document.createElement('div');
  el.className = 'celebration';
  el.innerHTML = '<div class="celebration-text">🎉 全部完成！</div>';
  document.body.appendChild(el);

  // Confetti
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 6 + Math.random() * 10;
      const colors = ['#ffd200','#f5576c','#4ecca3','#4facfe','#fa709a','#a18cd1','#667eea'];
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight * 0.3;
      p.style.cssText = `
        left: ${x}px; top: ${y}px;
        width: ${size}px; height: ${size}px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        --tx: ${(Math.random()-0.5)*200}px;
        --ty: ${100+Math.random()*200}px;
        animation-duration: ${0.8+Math.random()*0.8}s;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2000);
    }, i * 30);
  }

  setTimeout(() => el.remove(), 3000);
}

function showTimeUp() {
  const el = document.createElement('div');
  el.className = 'celebration';
  el.innerHTML = '<div class="celebration-text">⏰ 时间到！</div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveState() {
  try {
    localStorage.setItem('hw_eliminator', JSON.stringify({
      students, completed, timerSeconds
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const data = JSON.parse(localStorage.getItem('hw_eliminator'));
    if (data) {
      students = data.students && data.students.length ? data.students : DEFAULT_STUDENTS;
      completed = data.completed || [];
      timerSeconds = data.timerSeconds || 600;
    }
  } catch(e) {}
}

/* ============================================================
   UTILS
   ============================================================ */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ============================================================
   BOOT
   ============================================================ */
init();
</script>
</body>
</html>
